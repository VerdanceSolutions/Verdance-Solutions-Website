<!doctype html>
<html>
  <head>
    <title>Exclusion Active</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Keep this out of search results -->
    <script>
      // Set a cookie that expires in 2 years
      document.cookie = "exclude_ga=true; max-age=63072000; path=/";
      alert("GA4 exclusion cookie has been set for this browser.");
    </script>
  </head>
  <body>
    <h1>You are now excluded from Verdance Analytics.</h1>
    <p>
      As long as this cookie exists in this browser, your visits won't be
      tracked.
    </p>
  </body>
</html>
